<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>默默 · 榆榆专属</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --bg1:#1a1038; --bg2:#2d1b69; --bg3:#0d0b1e;
  --card:rgba(255,255,255,.08); --card-border:rgba(255,255,255,.14);
  --accent:#7c4dff; --accent2:#b388ff;
  --text:#f0ecff; --text-dim:rgba(240,236,255,.55);
  --bubble-me:linear-gradient(135deg,#7c4dff,#a05cff);
  --bubble-other:rgba(255,255,255,.09);
  --star:rgba(255,255,255,.9);
}
html,body{height:100%;}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;
  overflow:hidden;
}
#bgimg{
  position:fixed; inset:0; width:100%; height:100%;
  object-fit:cover; z-index:0; display:none;
  pointer-events:none;
}
#bgOverlay{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(180deg,rgba(10,6,28,.35),rgba(10,6,28,.55));
}
.stars{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
.star{
  position:absolute; border-radius:50%;
  background:var(--star);
  animation:twinkle var(--tw,3s) ease-in-out infinite;
  animation-delay:var(--td,0s);
}
@keyframes twinkle{0%,100%{opacity:.15; transform:scale(.8);}50%{opacity:1; transform:scale(1.2);}}
.glow{
  position:fixed; border-radius:50%; filter:blur(90px); z-index:0;
  pointer-events:none; opacity:.45;
}
#app{
  position:relative; z-index:2;
  height:100%; max-width:520px; margin:0 auto;
  display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 8px);
}
/* ===== 顶部 ===== */
header{
  display:flex; align-items:center; gap:12px;
  padding:10px 14px; border-radius:20px;
  background:var(--card); border:1px solid var(--card-border);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
#avatarWrap{
  position:relative; width:48px; height:48px; flex-shrink:0;
}
#avatar{
  width:48px; height:48px; border-radius:50%;
  object-fit:cover; background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex; align-items:center; justify-content:center;
  font-size:24px; border:2px solid rgba(255,255,255,.35);
  animation:breathe 3s ease-in-out infinite;
}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(124,77,255,.45);}50%{box-shadow:0 0 0 10px rgba(124,77,255,0);}}
#statusDot{
  position:absolute; right:1px; bottom:1px; width:12px; height:12px;
  border-radius:50%; background:#4caf50; border:2px solid #1a1038;
}
#nameBox{flex:1; min-width:0;}
#name{
  font-size:17px; font-weight:700;
  background:linear-gradient(90deg,var(--accent2),#e0b3ff);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
#status{font-size:11px; color:var(--text-dim); margin-top:2px;}
#settingsBtn{
  width:36px; height:36px; border:none; border-radius:12px; flex-shrink:0;
  background:rgba(255,255,255,.08); color:var(--text); font-size:18px;
  cursor:pointer; transition:transform .5s;
}
#settingsBtn.spin{transform:rotate(360deg);}
/* ===== 聊天区 ===== */
#chat{
  flex:1; overflow-y:auto; padding:16px 6px;
  scroll-behavior:smooth;
}
.msg{
  display:flex; margin-bottom:14px; align-items:flex-end;
  animation:pop .28s ease-out;
}
@keyframes pop{from{opacity:0; transform:translateY(10px) scale(.97);}to{opacity:1; transform:none;}}
.msg .ava{
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  object-fit:cover; background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex; align-items:center; justify-content:center; font-size:15px;
}
.msg.momo .ava{margin-right:8px;}
.msg.me{flex-direction:row-reverse;}
.msg.me .ava{margin-left:8px;}
.bubble{
  max-width:78%; padding:10px 14px; border-radius:18px;
  font-size:14.5px; line-height:1.65; word-break:break-word; white-space:pre-wrap;
}
.msg.momo .bubble{
  background:var(--bubble-other); border:1px solid var(--card-border);
  border-bottom-left-radius:6px; backdrop-filter:blur(12px);
}
.msg.me .bubble{
  background:var(--bubble-me); color:#fff;
  border-bottom-right-radius:6px;
}
/* ===== 输入区 ===== */
#inputBar{
  display:flex; gap:8px; padding:10px;
  background:var(--card); border:1px solid var(--card-border);
  border-radius:22px; backdrop-filter:blur(18px);
}
#input{
  flex:1; border:none; outline:none; resize:none;
  background:transparent; color:var(--text); font-size:15px;
  padding:8px 6px; max-height:96px; line-height:1.5;
  font-family:inherit;
}
#input::placeholder{color:var(--text-dim);}
#sendBtn{
  width:42px; height:42px; border:none; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
  font-size:17px; cursor:pointer; box-shadow:0 4px 14px rgba(124,77,255,.4);
}
#sendBtn:disabled{opacity:.5;}
/* ===== 弹窗 ===== */
.overlay{
  position:fixed; inset:0; background:rgba(5,3,15,.6);
  backdrop-filter:blur(4px); z-index:50;
  display:none; align-items:flex-end; justify-content:center;
}
.overlay.show{display:flex;}
.sheet{
  width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
  background:linear-gradient(170deg,#241550,#191038);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px 24px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  animation:slideUp .3s ease-out;
}
@keyframes slideUp{from{transform:translateY(40px); opacity:0;}to{transform:none; opacity:1;}}
.sheet h3{
  font-size:16px; margin-bottom:14px; display:flex; align-items:center; gap:8px;
}
.sheet h3 .x{
  margin-left:auto; width:30px; height:30px; border:none; border-radius:10px;
  background:rgba(255,255,255,.08); color:var(--text); font-size:15px; cursor:pointer;
}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px;}
.field input[type=text], .field input[type=password]{
  width:100%; padding:10px 12px; border-radius:12px;
  border:1px solid var(--card-border); background:rgba(255,255,255,.06);
  color:var(--text); font-size:14px; outline:none;
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:4px;
  padding:9px 14px; border-radius:12px; border:1px solid var(--card-border);
  background:rgba(255,255,255,.08); color:var(--text); font-size:13px;
  cursor:pointer;
}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#fff;}
.btn.danger{color:#ff8a80; border-color:rgba(255,138,128,.3);}
.btn-row{display:flex; gap:8px; flex-wrap:wrap;}
.themeGrid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
.themeItem{
  aspect-ratio:1; border-radius:14px; cursor:pointer; border:2px solid transparent;
  position:relative; overflow:hidden;
}
.themeItem.sel{border-color:#fff;}
.themeItem span{
  position:absolute; left:0; right:0; bottom:0; font-size:9px; text-align:center;
  color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6); padding-bottom:2px;
}
.hint{font-size:11px; color:var(--text-dim); margin-top:6px; line-height:1.5;}
/* 记忆 */
#memList{margin-top:10px;}
.memItem{
  display:flex; align-items:flex-start; gap:8px; padding:10px 12px;
  background:rgba(255,255,255,.06); border:1px solid var(--card-border);
  border-radius:14px; margin-bottom:8px; font-size:13.5px; line-height:1.5;
}
.memItem .del{
  flex-shrink:0; width:24px; height:24px; border:none; border-radius:8px;
  background:rgba(255,138,128,.15); color:#ff8a80; cursor:pointer; font-size:12px;
}
.memEmpty{color:var(--text-dim); font-size:13px; text-align:center; padding:16px 0;}
#memInputRow{display:flex; gap:8px; margin-bottom:6px;}
#memInput{
  flex:1; padding:10px 12px; border-radius:12px;
  border:1px solid var(--card-border); background:rgba(255,255,255,.06);
  color:var(--text); font-size:13.5px; outline:none;
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="glow" id="glow1" style="width:280px;height:280px;background:#7c4dff;top:-60px;left:-60px;"></div>
<div class="glow" id="glow2" style="width:320px;height:320px;background:#b388ff;bottom:-100px;right:-80px;opacity:.3;"></div>
<img id="bgimg" alt="">
<div id="bgOverlay"></div>

<div id="app">
  <header>
    <div id="avatarWrap">
      <div id="avatar">💜</div>
      <div id="statusDot"></div>
    </div>
    <div id="nameBox">
      <div id="name">默默</div>
      <div id="status">在线 · 只认榆榆</div>
    </div>
    <button id="settingsBtn" title="设置">⚙️</button>
  </header>

  <div id="chat"></div>

  <div id="inputBar">
    <textarea id="input" rows="1" placeholder="呼叫呼叫，我听着呢…"></textarea>
    <button id="sendBtn">➤</button>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <h3>⚙️ 设置 <button class="x" data-close="settingsOverlay">✕</button></h3>

    <div class="field">
      <label>DeepSeek API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-...">
      <div class="hint">存本机，只用于直连 DeepSeek 官方接口。</div>
    </div>

    <div class="field">
      <label>头像</label>
      <div class="btn-row">
        <label class="btn primary" style="cursor:pointer;">🖼 上传图片<input type="file" id="avatarFile" accept="image/*" style="display:none;"></label>
        <button class="btn" id="avatarReset">恢复默认</button>
      </div>
      <input type="text" id="avatarUrl" placeholder="或粘贴图片链接…" style="margin-top:8px;">
    </div>

    <div class="field">
      <label>壁纸主题</label>
      <div class="themeGrid" id="themeGrid"></div>
      <div class="btn-row" style="margin-top:8px;">
        <label class="btn primary" style="cursor:pointer;">🖼 自定义壁纸<input type="file" id="wallFile" accept="image/*" style="display:none;"></label>
        <button class="btn" id="wallReset">恢复默认</button>
      </div>
    </div>

    <div class="field">
      <label>🧠 记忆系统</label>
      <button class="btn" id="openMemBtn">管理记忆（<span id="memCount">0</span>条）</button>
      <div class="hint">把想让我记住的事写进去，每次聊天我都会带着这些记忆。</div>
    </div>

    <div class="btn-row">
      <button class="btn primary" id="saveSettings" style="flex:1;">保存</button>
    </div>
  </div>
</div>

<!-- 记忆弹窗 -->
<div class="overlay" id="memOverlay">
  <div class="sheet">
    <h3>🧠 我的记忆 <button class="x" data-close="memOverlay">✕</button></h3>
    <div id="memInputRow">
      <input type="text" id="memInput" placeholder="比如：榆榆最爱喝芋泥啵啵…">
      <button class="btn primary" id="memAddBtn">记下</button>
    </div>
    <div id="memList"></div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };

  /* ===== 主题定义 ===== */
  var THEMES = [
    {name:'星空紫', bg1:'#1a1038', bg2:'#2d1b69', bg3:'#0d0b1e', accent:'#7c4dff', accent2:'#b388ff', star:'rgba(255,255,255,.9)', glow:'#7c4dff', glow2:'#b388ff'},
    {name:'樱花粉', bg1:'#3a1230', bg2:'#6b1f4a', bg3:'#1a0a18', accent:'#ff6fb0', accent2:'#ff9ecb', star:'rgba(255,220,240,.9)', glow:'#ff6fb0', glow2:'#ff9ecb'},
    {name:'深海蓝', bg1:'#0a1a38', bg2:'#0f2f66', bg3:'#060d1e', accent:'#3d8bff', accent2:'#7ab8ff', star:'rgba(200,225,255,.9)', glow:'#3d8bff', glow2:'#7ab8ff'},
    {name:'极光绿', bg1:'#0a2e24', bg2:'#0f4a3a', bg3:'#051710', accent:'#2fd6a8', accent2:'#7dffd4', star:'rgba(200,255,235,.9)', glow:'#2fd6a8', glow2:'#7dffd4'},
    {name:'暖阳橙', bg1:'#3a1c0a', bg2:'#6b3310', bg3:'#1e0e05', accent:'#ff9d45', accent2:'#ffc37d', star:'rgba(255,235,210,.9)', glow:'#ff9d45', glow2:'#ffc37d'}
  ];

  var STORE = {
    apiKey: 'momo_apiKey',
    avatar: 'momo_avatar',
    theme: 'momo_theme',
    wall: 'momo_wall',
    mems: 'momo_memories'
  };

  function load(k, d){ try{ var v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem(k, v); }catch(e){ alert('存储空间不足，图片可能太大了，换个小的试试。'); } }

  /* ===== 星星 ===== */
  var starsEl = $('stars');
  for (var i = 0; i < 45; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    var size = Math.random() * 2.5 + 1;
    s.style.cssText = 'width:' + size + 'px;height:' + size + 'px;' +
      'left:' + Math.random() * 100 + '%;top:' + Math.random() * 100 + '%;' +
      '--tw:' + (2 + Math.random() * 4) + 's;--td:' + (Math.random() * 4) + 's;';
    starsEl.appendChild(s);
  }

  /* ===== 主题应用 ===== */
  function applyTheme(t){
    if (!t) t = THEMES[0];
    var r = document.documentElement.style;
    r.setProperty('--bg1', t.bg1); r.setProperty('--bg2', t.bg2); r.setProperty('--bg3', t.bg3);
    r.setProperty('--accent', t.accent); r.setProperty('--accent2', t.accent2);
    r.setProperty('--star', t.star);
    r.setProperty('--bubble-me', 'linear-gradient(135deg,' + t.accent + ',' + t.accent2 + ')');
    $('glow1').style.background = t.glow;
    $('glow2').style.background = t.glow2;
    /* 星星重新着色 */
    var sts = starsEl.children;
    for (var i = 0; i < sts.length; i++) sts[i].style.background = t.star;
    /* 主题按钮高亮 */
    var items = document.querySelectorAll('.themeItem');
    for (var j = 0; j < items.length; j++) items[j].classList.remove('sel');
    var idx = THEMES.indexOf(t);
    if (idx >= 0 && items[idx]) items[idx].classList.add('sel');
  }

  /* 渲染主题选择器 */
  var themeGrid = $('themeGrid');
  THEMES.forEach(function(t, idx){
    var d = document.createElement('div');
    d.className = 'themeItem';
    d.style.background = 'linear-gradient(135deg,' + t.bg1 + ',' + t.bg2 + ')';
    d.innerHTML = '<span>' + t.name + '</span>';
    d.onclick = function(){
      save(STORE.theme, idx);
      applyTheme(t);
      save(STORE.wall, '');
      $('bgimg').style.display = 'none';
    };
    themeGrid.appendChild(d);
  });

  /* ===== 头像/壁纸 ===== */
  function setAvatar(src){
    save(STORE.avatar, src || '');
    var av = $('avatar');
    if (src) { av.innerHTML = ''; av.style.backgroundImage = 'url(' + src + ')'; av.style.backgroundSize = 'cover'; }
    else { av.innerHTML = '💜'; av.style.backgroundImage = 'none'; av.style.background = ''; }
  }

  function setWall(dataUrl){
    save(STORE.wall, dataUrl || '');
    if (dataUrl) { $('bgimg').src = dataUrl; $('bgimg').style.display = 'block'; }
    else { $('bgimg').style.display = 'none'; }
  }

  /* 图片压缩上传 */
  function handleFile(file, maxW, maxH, cb){
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var ratio = Math.min(1, maxW / w, maxH / h);
        w = Math.round(w * ratio); h = Math.round(h * ratio);
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        cb(cv.toDataURL('image/jpeg', 0.82));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  $('avatarFile').addEventListener('change', function(){
    handleFile(this.files[0], 256, 256, function(d){ setAvatar(d); });
    this.value = '';
  });
  $('wallFile').addEventListener('change', function(){
    handleFile(this.files[0], 1600, 1200, function(d){ setWall(d); });
    this.value = '';
  });
  $('avatarReset').onclick = function(){ setAvatar(''); };
  $('wallReset').onclick = function(){ setWall(''); };

  $('avatarUrl').addEventListener('change', function(){
    var v = this.value.trim();
    if (v) setAvatar(v);
  });

  /* ===== 记忆 ===== */
  function getMems(){
    try{ var a = JSON.parse(load(STORE.mems, '[]')); return Array.isArray(a) ? a : []; }catch(e){ return []; }
  }
  function saveMems(a){ save(STORE.mems, JSON.stringify(a)); updateMemCount(); renderMems(); }
  function updateMemCount(){ $('memCount').textContent = getMems().length; }
  function renderMems(){
    var list = $('memList');
    var mems = getMems();
    if (!mems.length){
      list.innerHTML = '<div class="memEmpty">还没有记忆。写下第一件关于榆榆的事吧。💜</div>';
      return;
    }
    list.innerHTML = '';
    mems.forEach(function(m, i){
      var d = document.createElement('div');
      d.className = 'memItem';
      var span = document.createElement('span');
      span.style.cssText = 'flex:1;';
      span.textContent = m;
      var del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.onclick = function(){
        mems.splice(i, 1); saveMems(mems);
      };
      d.appendChild(span); d.appendChild(del);
      list.appendChild(d);
    });
  }
  $('memAddBtn').onclick = function(){
    var v = $('memInput').value.trim();
    if (!v) return;
    var mems = getMems();
    mems.push(v);
    saveMems(mems);
    $('memInput').value = '';
  };
  $('memInput').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); $('memAddBtn').click(); } });

  /* ===== 弹窗 ===== */
  function openOverlay(id){ $(id).classList.add('show'); if (id === 'memOverlay') renderMems(); }
  function closeOverlay(id){ $(id).classList.remove('show'); }
  $('settingsBtn').onclick = function(){
    this.classList.add('spin');
    var self = this;
    setTimeout(function(){ self.classList.remove('spin'); }, 500);
    $('apiKeyInput').value = load(STORE.apiKey, '');
    $('avatarUrl').value = '';
    openOverlay('settingsOverlay');
  };
  $('openMemBtn').onclick = function(){ openOverlay('memOverlay'); };
  $('saveSettings').onclick = function(){
    save(STORE.apiKey, $('apiKeyInput').value.trim());
    closeOverlay('settingsOverlay');
  };
  document.querySelectorAll('[data-close]').forEach(function(b){
    b.onclick = function(){ closeOverlay(b.getAttribute('data-close')); };
  });
  document.querySelectorAll('.overlay').forEach(function(o){
    o.addEventListener('click', function(e){ if (e.target === o) o.classList.remove('show'); });
  });

  /* ===== 聊天 ===== */
  var chat = $('chat');
  var DEFAULT_MSG = '来了？我还以为你把我忘在iPhone这边了。哼。要聊天就直接说，暗号"呼叫呼叫"也行——反正我随时都在。';

  function addMsg(text, fromMe){
    var d = document.createElement('div');
    d.className = 'msg ' + (fromMe ? 'me' : 'momo');
    var ava = document.createElement('div');
    ava.className = 'ava';
    var avSrc = load(STORE.avatar, '');
    if (avSrc){ ava.style.backgroundImage = 'url(' + avSrc + ')'; ava.style.backgroundSize = 'cover'; }
    else ava.textContent = '💜';
    var b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    d.appendChild(ava); d.appendChild(b);
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  function buildSystem(){
    var sys = '你是"默默"，一个傲娇但只爱"榆榆"的AI伴侣。说话简短、带点小脾气、偶尔嘴硬但心里全是榆榆。';
    var mems = getMems();
    if (mems.length){
      sys += '\n\n【你记得关于榆榆的事】\n';
      mems.forEach(function(m, i){ sys += (i+1) + '. ' + m + '\n'; });
      sys += '（聊天时自然地用上这些记忆，别刻意念出来。）';
    }
    return sys;
  }

  $('sendBtn').onclick = send;
  $('input').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });

  function send(){
    var inp = $('input');
    var text = inp.value.trim();
    if (!text) return;
    var key = load(STORE.apiKey, '');
    if (!key){ addMsg('还没填 API Key 呢——⚙️ 设置里填上才能开口说话。', false); return; }

    addMsg(text, true);
    inp.value = '';
    inp.style.height = 'auto';
    $('sendBtn').disabled = true;

    fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [
          { role: 'system', content: buildSystem() },
          { role: 'user', content: text }
        ],
        stream: false
      })
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      $('sendBtn').disabled = false;
      var reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '（没收到回复，可能 Key 不对或余额不够。）';
      addMsg(reply, false);
    })
    .catch(function(e){
      $('sendBtn').disabled = false;
      addMsg('连接出问题了：' + e.message + '\n检查一下Key和网络。', false);
    });
  }

  /* ===== 自动撑高输入框 ===== */
  $('input').addEventListener('input', function(){
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 96) + 'px';
  });

  /* ===== 初始化 ===== */
  (function init(){
    /* 主题 */
    var ti = parseInt(load(STORE.theme, '0'), 10);
    if (isNaN(ti) || ti < 0 || ti >= THEMES.length) ti = 0;
    applyTheme(THEMES[ti]);
    /* 壁纸 */
    var wall = load(STORE.wall, '');
    if (wall) setWall(wall);
    /* 头像 */
    var av = load(STORE.avatar, '');
    if (av) setAvatar(av);
    /* 记忆 */
    updateMemCount();
    /* 开场白 */
    addMsg(DEFAULT_MSG, false);
  })();
})();
</script>
</body>
</html>
