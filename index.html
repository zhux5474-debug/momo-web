<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>默默 · 榆榆专属</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg1:#1a1038; --bg2:#2d1b69; --bg3:#0d0b1e;
  --card:rgba(255,255,255,.08); --card-border:rgba(255,255,255,.14);
  --accent:#7c4dff; --accent2:#b388ff;
  --text:#f0ecff; --text-dim:rgba(240,236,255,.55);
  --bubble-me:linear-gradient(135deg,#7c4dff,#a05cff);
  --bubble-other:rgba(255,255,255,.09);
}
html,body{height:100%; height:100dvh; touch-action:pan-y;}
*{touch-action:pan-y;}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;
  overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
#webBg{
  position:fixed; inset:0; z-index:0;
  background:radial-gradient(ellipse at 30% 20%, rgba(124,77,255,.25), transparent 60%),
             radial-gradient(ellipse at 70% 80%, rgba(179,136,255,.18), transparent 60%);
  pointer-events:none;
}

/* ================= 手机壳 ================= */
#phone{
  position:relative; z-index:2;
  width:min(390px, 100vw); height:min(844px, 100dvh);
  background:#000;
  border-radius:44px;
  overflow:hidden;
  box-shadow:0 0 0 10px #1a1a1e, 0 0 0 12px #2c2c31, 0 30px 80px rgba(0,0,0,.7), 0 0 120px rgba(124,77,255,.15);
  display:flex; flex-direction:column;
  user-select:none; -webkit-user-select:none;
}
@media (max-width:420px), (max-height:880px){
  #phone{border-radius:0; box-shadow:none; width:100vw; height:100dvh;}
}
/* 灵动岛 */
#island{
  position:absolute; top:10px; left:50%; transform:translateX(-50%);
  width:118px; height:32px; background:#000; border-radius:20px; z-index:200;
}
/* 状态栏 */
#statusBar{
  position:absolute; top:0; left:0; right:0; height:54px;
  display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 26px 8px; z-index:190;
  color:#fff; font-size:14px; font-weight:600;
  pointer-events:none;
}
#sbTime{letter-spacing:.5px;}
#sbRight{display:flex; align-items:center; gap:5px; font-size:12px;}
.sbIcon{font-size:13px;}

/* ================= 壁纸 ================= */
#wallImg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; display:none;}
#wallGrad{position:absolute; inset:0; z-index:0; background:linear-gradient(165deg,var(--bg1),var(--bg2) 55%,var(--bg3));}
#wallDim{position:absolute; inset:0; z-index:1; pointer-events:none;}

/* ================= 锁屏 ================= */
#lockScreen{
  position:absolute; inset:0; z-index:150;
  display:flex; flex-direction:column; align-items:center;
  padding-top:150px; cursor:grab;
  transition:transform .35s ease, opacity .35s ease;
}
#lockScreen.unlocking{transform:translateY(-100%); opacity:0; pointer-events:none;}
#lockDate{font-size:16px; color:rgba(255,255,255,.85); letter-spacing:2px;}
#lockTime{font-size:76px; font-weight:200; color:#fff; line-height:1.15; text-shadow:0 2px 20px rgba(0,0,0,.3);}
#lockTime b{font-weight:600;}
#lockHint{margin-top:8px; font-size:13px; color:rgba(255,255,255,.6);}
#unlockBar{
  position:absolute; bottom:70px;
  width:230px; height:58px; border-radius:29px;
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:13px; letter-spacing:2px;
  transition:background .3s;
}
#unlockKnob{
  position:absolute; left:4px; top:4px; width:50px; height:50px; border-radius:50%;
  background:rgba(255,255,255,.95); color:#000;
  display:flex; align-items:center; justify-content:center; font-size:20px;
  box-shadow:0 4px 14px rgba(0,0,0,.3);
  transition:left .1s ease-out;
}
#unlockBar.dragging{background:rgba(255,255,255,.28);}
#unlockBar.done{background:rgba(124,77,255,.85);}

/* ================= 桌面 ================= */
#homeScreen{
  position:absolute; inset:0; z-index:100;
  display:none; flex-direction:column;
  padding:70px 22px 0;
}
#homeScreen.show{display:flex;}
#widgetClock{
  margin:14px 0 4px; color:#fff;
  text-shadow:0 2px 14px rgba(0,0,0,.35);
}
#wTime{font-size:52px; font-weight:300; letter-spacing:1px;}
#wDate{font-size:15px; opacity:.85; margin-top:2px;}
#appGrid{
  flex:1; display:grid; grid-template-columns:repeat(4, 1fr);
  grid-auto-rows:minmax(104px, auto); gap:10px 6px; align-content:start;
  padding-top:18px;
}
.appIcon{
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:6px;
  cursor:pointer; padding:10px 0;
  -webkit-touch-callout:none; touch-action:manipulation;
}
.appIcon:active{transform:scale(.92);}
.appIcon .ico{
  width:66px; height:66px; border-radius:17px;
  display:flex; align-items:center; justify-content:center;
  font-size:31px; color:#fff; position:relative;
  box-shadow:0 4px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
  background:linear-gradient(145deg, var(--ia, #7c4dff), var(--ib, #a05cff));
}
.appIcon .ico img{width:100%; height:100%; border-radius:17px; object-fit:cover;}
.appIcon .badge{
  position:absolute; top:-5px; right:-5px; min-width:19px; height:19px; padding:0 4px;
  border-radius:10px; background:#ff3b30; color:#fff; font-size:11px; font-weight:700;
  display:flex; align-items:center; justify-content:center; border:1.5px solid #000;
}
.appIcon .lbl{
  font-size:12px; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.7);
  max-width:76px; text-align:center; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
}
/* Dock */
#dock{
  margin:6px 0 calc(14px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-radius:28px; padding:12px 8px;
  display:grid; grid-template-columns:repeat(4,1fr); gap:4px;
}
.dockIcon .ico{width:62px; height:62px; border-radius:16px;}

/* ================= 应用页 ================= */
#appScreen{
  position:absolute; inset:0; z-index:160;
  display:none; flex-direction:column;
  background:linear-gradient(170deg,var(--bg1),var(--bg3));
}
#appScreen.show{display:flex; animation:appIn .28s ease-out;}
@keyframes appIn{from{transform:scale(.96) translateY(14px); opacity:0;}to{transform:none; opacity:1;}}
#appNav{
  display:flex; align-items:center; gap:10px;
  padding:60px 16px 10px;
  background:rgba(0,0,0,.25); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
#appNav .back{
  width:32px; height:32px; border:none; border-radius:50%;
  background:rgba(255,255,255,.14); color:#fff; font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
#appTitle{flex:1; font-size:17px; font-weight:700; color:#fff; text-align:center; margin-right:32px;}
#appBody{flex:1; overflow-y:auto; padding:14px; position:relative;}

/* ================= 通知横幅 ================= */
#notify{
  position:absolute; top:8px; left:12px; right:12px; z-index:300;
  display:none; align-items:center; gap:10px;
  background:rgba(30,24,48,.85); border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-radius:20px; padding:10px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  animation:notifyIn .35s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes notifyIn{from{transform:translateY(-70px); opacity:0;}to{transform:none; opacity:1;}}
#notify .nIco{
  width:40px; height:40px; border-radius:12px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:20px;
  background:linear-gradient(145deg,var(--accent),var(--accent2));
}
#notify .nTitle{font-size:13px; font-weight:700; color:#fff;}
#notify .nBody{font-size:12px; color:rgba(255,255,255,.75); margin-top:2px; line-height:1.4;}
#notify .nClose{margin-left:auto; color:rgba(255,255,255,.5); cursor:pointer; padding:4px; font-size:12px;}

/* ================= 通用组件 ================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:4px;
  padding:9px 14px; border-radius:12px; border:1px solid var(--card-border);
  background:rgba(255,255,255,.08); color:var(--text); font-size:13px;
  cursor:pointer;
}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#fff;}
.btn.danger{color:#ff8a80; border-color:rgba(255,138,128,.3);}
.btn-row{display:flex; gap:8px; flex-wrap:wrap;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px;}
.field input[type=text], .field input[type=password], .field textarea{
  width:100%; padding:10px 12px; border-radius:12px;
  border:1px solid var(--card-border); background:rgba(255,255,255,.06);
  color:var(--text); font-size:14px; outline:none; font-family:inherit; resize:none;
}
.hint{font-size:11px; color:var(--text-dim); margin-top:6px; line-height:1.5;}
.emptyHint{color:var(--text-dim); font-size:13px; text-align:center; padding:30px 0; line-height:1.7;}

/* ================= 微信 ================= */
#wxBody{display:flex; flex-direction:column; height:100%; padding:0;}
#wxHeader{
  display:flex; align-items:center; gap:10px; padding:8px 14px;
  background:rgba(0,0,0,.22); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
#wxHeader .ava{
  width:38px; height:38px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex; align-items:center; justify-content:center; font-size:19px;
  background-size:cover;
}
#wxHeader .nm{font-size:15px; font-weight:700; color:#fff;}
#wxHeader .st{font-size:11px; color:var(--text-dim); margin-top:1px;}
#wxChat{
  flex:1; overflow-y:auto; padding:14px 12px;
  background:rgba(0,0,0,.12);
}
#wxBar{
  display:flex; gap:8px; align-items:flex-end;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,.28); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
#wxInput{
  flex:1; border:none; outline:none; resize:none;
  background:rgba(255,255,255,.12); color:#fff; font-size:15px;
  border-radius:20px; padding:9px 14px; max-height:96px; line-height:1.5; font-family:inherit;
}
#wxInput::placeholder{color:rgba(255,255,255,.4);}
#wxSend{
  width:42px; height:42px; border:none; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
  font-size:17px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.35);
}
#wxSend:disabled{opacity:.5;}
.wxMsg{display:flex; margin-bottom:12px; align-items:flex-end; animation:pop .25s ease-out;}
@keyframes pop{from{opacity:0; transform:translateY(8px) scale(.97);}to{opacity:1; transform:none;}}
.wxMsg .ava{
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex; align-items:center; justify-content:center; font-size:17px;
  background-size:cover;
}
.wxMsg.me{flex-direction:row-reverse;}
.wxMsg.me .ava{margin-left:8px;}
.wxMsg.momo .ava{margin-right:8px;}
.wxBubble{
  max-width:72%; padding:9px 13px; border-radius:16px;
  font-size:14px; line-height:1.6; word-break:break-word; white-space:pre-wrap;
  box-shadow:0 1px 2px rgba(0,0,0,.15);
}
.wxMsg.me .wxBubble{background:#95ec69; color:#111; border-bottom-right-radius:5px;}
.wxMsg.momo .wxBubble{background:#fff; color:#111; border-bottom-left-radius:5px;}
.wxTime{text-align:center; font-size:11px; color:rgba(255,255,255,.45); margin:8px 0;}
#wxBody{position:relative;}
#wxMore{
  width:30px; height:30px; border-radius:50%; border:none; background:rgba(255,255,255,.1);
  color:#fff; font-size:18px; line-height:1; cursor:pointer; flex-shrink:0;
}
#wxFaceBtn{
  width:34px; height:34px; border-radius:50%; border:none; background:rgba(255,255,255,.12);
  color:#fff; font-size:17px; cursor:pointer; flex-shrink:0;
}
#wxEmojiPanel{
  display:none; position:absolute; left:10px; right:10px; bottom:64px; z-index:50;
  background:rgba(30,30,35,.97); border:1px solid rgba(255,255,255,.1); border-radius:14px;
  padding:10px; flex-wrap:wrap; gap:8px; box-shadow:0 6px 20px rgba(0,0,0,.4);
}
#wxEmojiPanel .wxEmoji{
  width:38px; height:38px; display:flex; align-items:center; justify-content:center;
  font-size:22px; border-radius:10px; cursor:pointer;
}
#wxEmojiPanel .wxEmoji:active{background:rgba(255,255,255,.15);}
#wxSetPanel{
  display:none; position:absolute; inset:0; background:rgba(0,0,0,.5);
  z-index:60; align-items:flex-end; justify-content:center;
}
#wxSetPanel .wxSetCard{
  width:100%; max-height:78%; overflow-y:auto;
  background:#26262b; border-radius:20px 20px 0 0; padding:16px;
  box-shadow:0 -6px 24px rgba(0,0,0,.4);
}
.wxSetHead{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.wxSetHead b{font-size:16px; color:#fff;}
.wxSetHead button{border:none; background:rgba(255,255,255,.1); color:#fff; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:14px;}
#wxEmojiList span{
  display:inline-flex; align-items:center; gap:4px; background:rgba(255,255,255,.1);
  border-radius:9px; padding:4px 8px; font-size:16px; color:#fff;
}
#wxEmojiList span i{font-style:normal; color:rgba(255,255,255,.5); cursor:pointer; font-size:12px;}
.recalled .wxBubble{background:rgba(0,0,0,.25)!important; color:rgba(255,255,255,.4)!important; font-size:12px;}
#msgMenu{
  display:none; position:absolute; z-index:70; min-width:96px;
  background:rgba(40,40,45,.97); border:1px solid rgba(255,255,255,.12); border-radius:12px;
  padding:5px; box-shadow:0 8px 24px rgba(0,0,0,.45);
}
#msgMenu button{
  display:block; width:100%; text-align:left; border:none; background:none; color:#fff;
  font-size:14px; padding:9px 12px; border-radius:8px; cursor:pointer;
}
#msgMenu button:active{background:rgba(255,255,255,.12);}

/* ================= 世界书 ================= */
.wbItem{
  background:rgba(255,255,255,.06); border:1px solid var(--card-border);
  border-radius:14px; padding:12px; margin-bottom:10px;
}
.wbItem .top{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.wbItem .kw{
  font-size:12px; font-weight:700; color:var(--accent2);
  background:rgba(124,77,255,.15); padding:2px 8px; border-radius:8px;
}
.wbItem .ct{font-size:13px; line-height:1.6; color:var(--text); white-space:pre-wrap; word-break:break-word;}
.wbItem .btns{margin-top:8px; display:flex; gap:6px;}
.tag{
  font-size:10px; padding:2px 7px; border-radius:6px;
  background:rgba(255,255,255,.1); color:var(--text-dim);
}
.tag.on{background:rgba(76,175,80,.2); color:#81c784;}
.tag.off{background:rgba(255,59,48,.15); color:#ff8a80;}

/* ================= 日记 ================= */
.calHead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.calHead .t{font-size:16px; font-weight:700;}
.calHead .navBtn{
  width:30px; height:30px; border:none; border-radius:9px;
  background:rgba(255,255,255,.1); color:#fff; font-size:14px; cursor:pointer;
}
.calGrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:12px;}
.calGrid .wd{text-align:center; font-size:11px; color:var(--text-dim); padding:4px 0;}
.calDay{
  aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:13px; cursor:pointer; color:var(--text); position:relative;
}
.calDay:hover{background:rgba(255,255,255,.12);}
.calDay.sel{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-weight:700;}
.calDay.other{color:rgba(255,255,255,.25);}
.calDay .dot{
  position:absolute; bottom:3px; left:50%; transform:translateX(-50%);
  width:5px; height:5px; border-radius:50%;
}
.diaryCard{
  background:rgba(255,255,255,.06); border:1px solid var(--card-border);
  border-radius:14px; padding:12px; margin-bottom:10px;
}
.diaryCard .h{display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:12px; color:var(--text-dim);}
.diaryCard .h .who{
  font-size:11px; font-weight:700; padding:2px 8px; border-radius:7px;
}
.who.me{background:rgba(124,77,255,.25); color:#c9b4ff;}
.who.momo{background:rgba(52,199,89,.2); color:#7ddb9a;}
.diaryCard .txt{font-size:13.5px; line-height:1.7; color:var(--text); white-space:pre-wrap; word-break:break-word;}
.moodRow{display:flex; gap:8px; margin:8px 0;}
.mood{
  font-size:22px; cursor:pointer; padding:4px 6px; border-radius:10px;
  border:2px solid transparent; background:none; transition:transform .15s;
}
.mood:hover{transform:scale(1.15);}
.mood.sel{border-color:var(--accent); background:rgba(124,77,255,.15);}

/* ================= 五子棋 ================= */
#gmWrap{display:flex; flex-direction:column; align-items:center; height:100%; padding:0;}
#gmInfo{
  width:100%; display:flex; align-items:center; justify-content:space-between;
  padding:6px 4px 10px; font-size:13px; color:var(--text);
}
#gmInfo .turn{font-weight:700; color:var(--accent2);}
#gmBoardWrap{
  position:relative; width:min(100%, 360px); aspect-ratio:1;
  background:linear-gradient(160deg,#e8c98f,#d9a95f);
  border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.35);
}
#gmBoard{width:100%; height:100%; display:block; border-radius:14px; touch-action:none; cursor:pointer;}
#unlockBar,#unlockKnob{touch-action:none;}
#gmChatBox{
  width:100%; flex:1; min-height:70px; margin-top:10px;
  background:rgba(255,255,255,.06); border:1px solid var(--card-border);
  border-radius:12px; padding:8px 10px; overflow-y:auto; font-size:12px; line-height:1.6;
  color:var(--text-dim);
}
#gmChatBox b{color:var(--accent2);}
#gmBtns{display:flex; gap:8px; width:100%; margin-top:10px;}
#gmBtns .btn{flex:1;}
#gmChatRow{display:flex; gap:6px; width:100%; margin-top:8px;}
#gmChatIn{
  flex:1; border:none; outline:none; resize:none;
  background:rgba(255,255,255,.1); color:#fff; font-size:13px;
  border-radius:16px; padding:8px 12px; font-family:inherit; max-height:60px;
}
#gmChatIn::placeholder{color:rgba(255,255,255,.35);}
#gmChatSend{
  width:38px; height:38px; border:none; border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; cursor:pointer;
}

/* ================= 记忆 ================= */
.memItem{
  display:flex; align-items:flex-start; gap:8px; padding:10px 12px;
  background:rgba(255,255,255,.06); border:1px solid var(--card-border);
  border-radius:14px; margin-bottom:8px; font-size:13.5px; line-height:1.5;
}
.memItem .del{
  flex-shrink:0; width:24px; height:24px; border:none; border-radius:8px;
  background:rgba(255,138,128,.15); color:#ff8a80; cursor:pointer; font-size:12px;
}
#memInputRow{display:flex; gap:8px; margin-bottom:8px;}
#memInput{
  flex:1; padding:10px 12px; border-radius:12px;
  border:1px solid var(--card-border); background:rgba(255,255,255,.06);
  color:var(--text); font-size:13.5px; outline:none;
}

/* ================= 设置 ================= */
.themeGrid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:10px;}
.themeItem{
  aspect-ratio:1; border-radius:14px; cursor:pointer; border:2px solid transparent;
  position:relative; overflow:hidden;
}
.themeItem.sel{border-color:#fff;}
.themeItem span{
  position:absolute; left:0; right:0; bottom:0; font-size:9px; text-align:center;
  color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6); padding-bottom:2px;
}
.iconEditRow{
  display:flex; align-items:center; gap:10px; padding:10px;
  background:rgba(255,255,255,.06); border:1px solid var(--card-border);
  border-radius:14px; margin-bottom:8px;
}
.iconEditRow .peek{
  width:46px; height:46px; border-radius:12px; flex-shrink:0;

</style>
</head>
<body>

<div id="webBg"></div>

<div id="phone">
  <div id="island"></div>
  <div id="statusBar">
    <span id="sbTime"></span>
    <span id="sbRight"><span class="sbIcon">📶</span><span class="sbIcon">🔋</span><span id="sbBatt">100%</span></span>
  </div>

  <img id="wallImg" alt="">
  <div id="wallGrad"></div>
  <div id="wallDim"></div>

  <!-- 锁屏 -->
  <div id="lockScreen">
    <div id="lockDate"></div>
    <div id="lockTime"></div>
    <div id="lockHint">上滑解锁</div>

  <!-- 桌面 -->

    <div id="widgetClock"><div id="wTime"></div><div id="wDate"></div></div>
    <div id="appGrid"></div>
    <div id="dock"></div>
  </div>

  <!-- 应用页 -->
  <div id="appScreen">
    <div id="appNav">
      <button class="back" id="appBack">‹</button>
      <div id="appTitle">应用</div>
    </div>
    <div id="appBody"></div>
  </div>

  <!-- 通知 -->
  <div id="notify">
    <div class="nIco" id="nIco">💬</div>
    <div style="flex:1;min-width:0;">
      <div class="nTitle" id="nTitle">默默</div>
      <div class="nBody" id="nBody"></div>
    </div>
    <span class="nClose" id="nClose">✕</span>
  </div>
</div>

<script>
(function(){
'use strict';
/* 阻止一切页面缩放（Operit WebView 会无视 user-scalable=no） */
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('gesturechange', function(e){ e.preventDefault(); });
document.addEventListener('gestureend', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){ if(e.touches.length>1){ e.preventDefault(); } }, {passive:false});
document.addEventListener('dblclick', function(e){ e.preventDefault(); });
var $ = function(id){ return document.getElementById(id); };

/* ===== 存储 ===== */
var STORE = {
  apiKey:'momo_apiKey', avatar:'momo_avatar', theme:'momo_theme', wall:'momo_wall',
  mems:'momo_memories', chats:'momo_chats', wb:'momo_worldbook',
  diary:'momo_diary', icons:'momo_icons', badges:'momo_badges', unlock:'momo_unlocked',
  me:'momo_meAvatar', wxWall:'momo_wxWall', note:'momo_note', emoji:'momo_emoji',
  themeCustom:'momo_themeCustom'
};
function load(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function loadJ(k,d){ try{ var v=JSON.parse(load(k,'null')); return v===null?d:v; }catch(e){ return d; } }
function saveJ(k,v){ return save(k,JSON.stringify(v)); }

/* ===== 主题 ===== */
var THEMES = [
  {name:'星空紫', bg1:'#1a1038', bg2:'#2d1b69', bg3:'#0d0b1e', accent:'#7c4dff', accent2:'#b388ff'},
  {name:'樱花粉', bg1:'#3a1230', bg2:'#6b1f4a', bg3:'#1a0a18', accent:'#ff6fb0', accent2:'#ff9ecb'},
  {name:'深海蓝', bg1:'#0a1a38', bg2:'#0f2f66', bg3:'#060d1e', accent:'#3d8bff', accent2:'#7ab8ff'},
  {name:'极光绿', bg1:'#0a2e24', bg2:'#0f4a3a', bg3:'#051710', accent:'#2fd6a8', accent2:'#7dffd4'},
  {name:'暖阳橙', bg1:'#3a1c0a', bg2:'#6b3310', bg3:'#1e0e05', accent:'#ff9d45', accent2:'#ffc37d'}
];
function shade(hex,f){
  hex = (hex||'#7c4dff').replace('#','');
  if(hex.length===3) hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
  r=Math.min(255,Math.round(r*f)); g=Math.min(255,Math.round(g*f)); b=Math.min(255,Math.round(b*f));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function applyTheme(t){
  if(!t) t = THEMES[0];
  var r = document.documentElement.style;
  var c = loadJ(STORE.themeCustom, null);
  if(c && typeof c==='object' && (c.accent||c.accent2)){
    var a = c.accent||t.accent, b = c.accent2||t.accent2;
    r.setProperty('--bg1', shade(a,.18));
    r.setProperty('--bg2', shade(a,.40));
    r.setProperty('--bg3', shade(a,.09));
    r.setProperty('--accent',a); r.setProperty('--accent2',b);
    r.setProperty('--bubble-me','linear-gradient(135deg,'+a+','+b+')');
  } else {
    r.setProperty('--bg1',t.bg1); r.setProperty('--bg2',t.bg2); r.setProperty('--bg3',t.bg3);
    r.setProperty('--accent',t.accent); r.setProperty('--accent2',t.accent2);
    r.setProperty('--bubble-me','linear-gradient(135deg,'+t.accent+','+t.accent2+')');
  }
}
function getTheme(){ var i=parseInt(load(STORE.theme,'0'),10); if(isNaN(i)||i<0||i>=THEMES.length) i=0; return THEMES[i]; }

/* ===== 壁纸 ===== */
function setWall(dataUrl){
  var ok = save(STORE.wall, dataUrl||'');
  if(dataUrl){ $('wallImg').src=dataUrl; $('wallImg').style.display='block'; $('wallGrad').style.display='none'; }
  else { $('wallImg').style.display='none'; $('wallGrad').style.display='block'; }
  return ok;
}

/* ===== 状态栏时钟 ===== */
function pad(n){ return (n<10?'0':'')+n; }
var WEEK = ['日','一','二','三','四','五','六'];
function tickClock(){
  var d = new Date();
  var h=pad(d.getHours()), m=pad(d.getMinutes());
  $('sbTime').textContent = h+':'+m;
  $('lockTime').innerHTML = d.getHours()+'<b>:'+m+'</b>';
  $('lockDate').textContent = (d.getMonth()+1)+'月'+d.getDate()+'日 星期'+WEEK[d.getDay()];
  $('wTime').textContent = h+':'+m;
  $('wDate').textContent = (d.getMonth()+1)+'月'+d.getDate()+'日 星期'+WEEK[d.getDay()];
}
setInterval(tickClock, 10000); tickClock();

/* ===== 锁屏 ===== */
var unlocked = load(STORE.unlock,'0')==='1';
var lockEl = $('lockScreen');
function doUnlock(){
  if(unlocked) return;
  unlocked = true; save(STORE.unlock,'1');
  lockEl.classList.add('unlocking');
  $('homeScreen').classList.add('show');
  setTimeout(function(){ lockEl.style.display='none'; }, 400);
  onUnlocked && onUnlocked();
}
var onUnlocked = null;
/* 滑动解锁 */
(function(){
  var bar=$('unlockBar'), knob=$('unlockKnob');
  var startX=0, moved=false;
  bar.addEventListener('touchstart', function(e){
    startX = e.touches[0].clientX; moved=false;
    bar.classList.add('dragging');
  });
  bar.addEventListener('touchmove', function(e){
    var dx = e.touches[0].clientX - startX;
    if(dx<0) dx=0;
    var max = bar.clientWidth - knob.clientWidth - 8;
    if(dx>max) dx=max;
    knob.style.left = (4+dx)+'px';
    if(dx>max*0.55){ bar.classList.add('done'); $('unlockTxt').textContent='松手解锁'; }
    else { bar.classList.remove('done'); $('unlockTxt').textContent='滑动来解锁'; }
    moved=true;
  });
  function reset(){ knob.style.left='4px'; bar.classList.remove('dragging','done'); $('unlockTxt').textContent='滑动来解锁'; }
  bar.addEventListener('touchend', function(){
    if(bar.classList.contains('done')){ doUnlock(); }
    reset();
  });
  bar.addEventListener('mouseup', reset);
  /* 上滑锁屏主体 */
  lockEl.addEventListener('touchstart', function(e){
    if(e.target.closest('#unlockBar')) return;
    var sy = e.touches[0].clientY; var active=false;
    function mv(ev){
      var dy = ev.touches[0].clientY - sy;
      if(dy < -40) active=true;
      if(active && dy < -70) doUnlock();
    }
    function up(){ document.removeEventListener('touchmove',mv); document.removeEventListener('touchend',up); }
    document.addEventListener('touchmove',mv,{passive:true}); document.addEventListener('touchend',up);
  });
})();

/* ===== 应用定义 ===== */
var APPS = [
  {id:'wechat',  emoji:'💬', ia:'#34c759', ib:'#28a745', name:'微信',  dock:true},
  {id:'diary',   emoji:'📔', ia:'#ff9f0a', ib:'#ff7a00', name:'日记',  dock:true},
  {id:'worldbook',emoji:'📖',ia:'#5e5ce6', ib:'#7d7aff', name:'世界书',dock:false},
  {id:'gomoku',  emoji:'⚄', ia:'#ff375f', ib:'#d6356a', name:'五子棋',dock:false},
  {id:'memory',  emoji:'🧠', ia:'#64d2ff', ib:'#32ade6', name:'记忆',  dock:false},
  {id:'settings',emoji:'⚙️', ia:'#8e8e93', ib:'#636366', name:'设置',  dock:true}
];
function getIcons(){
  var def = {};
  APPS.forEach(function(a){ def[a.id] = {emoji:a.emoji, ia:a.ia, ib:a.ib, name:a.name, img:''}; });
  var saved = loadJ(STORE.icons, {});
  if(saved && typeof saved==='object' && !Array.isArray(saved)){
    Object.keys(saved).forEach(function(k){
      if(!def[k]) return;
      var v=saved[k];
      if(!v || typeof v!=='object') return;
      var o=Object.assign({}, def[k], v);
      if(typeof o.name!=='string' || !o.name) o.name=def[k].name;
      if(typeof o.emoji!=='string' || !o.emoji) o.emoji=def[k].emoji;
      if(typeof o.ia!=='string' || !o.ia) o.ia=def[k].ia;
      if(typeof o.ib!=='string' || !o.ib) o.ib=def[k].ib;
      if(typeof o.img!=='string' || o.img.indexOf('data:image/')!==0) o.img='';
      def[k]=o;
    });
  }
  return def;
}
function saveIcons(icons){ return saveJ(STORE.icons, icons); }
function getBadges(){
  var b = loadJ(STORE.badges, {});
  return b;
}
function setBadge(id, n){
  var b = getBadges(); b[id]=n; saveJ(STORE.badges,b); renderHome();
}

/* ===== 桌面渲染 ===== */
var dockEl = $('dock'), gridEl = $('appGrid');
function iconHTML(app, icons, dock){
  var ic = icons[app.id] || app;
  var badge = getBadges()[app.id];
  return '<div class="appIcon '+(dock?'dockIcon':'')+'" data-app="'+app.id+'">' +
    '<div class="ico" style="--ia:'+ic.ia+';--ib:'+ic.ib+';background:linear-gradient(145deg,'+ic.ia+','+ic.ib+');">' +
    (ic.img ? '<img src="'+ic.img+'" alt="">' : (ic.emoji||app.emoji)) +
    (badge ? '<span class="badge">'+badge+'</span>' : '') +
    '</div><div class="lbl">'+(ic.name||app.name)+'</div></div>';
}
function renderHome(){
  var icons = getIcons();
  var dockApps = APPS.filter(function(a){ return a.dock; });
  var gridApps = APPS.filter(function(a){ return !a.dock; });
  gridEl.innerHTML = gridApps.map(function(a){ return iconHTML(a, icons, false); }).join('');
  dockEl.innerHTML = dockApps.map(function(a){ return iconHTML(a, icons, true); }).join('');
  document.querySelectorAll('.appIcon').forEach(function(el){
    el.addEventListener('click', function(){ openApp(el.getAttribute('data-app')); });
  });
}

/* ===== 应用切换 ===== */
var appScreen = $('appScreen');
var currentApp = null;
function openApp(id){
  currentApp = id;
  $('appTitle').textContent = (getIcons()[id]||{}).name || '应用';
  var body = $('appBody');
  body.innerHTML = '';
  body.scrollTop = 0;
  appScreen.classList.add('show');
  if (appRenderers[id]) appRenderers[id](body);
}
$('appBack').onclick = function(){
  appScreen.classList.remove('show');
  currentApp = null;
  $('appBody').innerHTML = '';
};
var appRenderers = {};

/* ===== 通知横幅 ===== */
var notifyTimer = null;
function showNotify(ico, title, body, onClick){
  $('nIco').textContent = ico;
  $('nTitle').textContent = title;
  $('nBody').textContent = body;
  var n = $('notify');
  n.style.display = 'flex';
  n.onclick = function(e){ if(e.target.id==='nClose'){ hideNotify(); return; } if(onClick) onClick(); hideNotify(); };
  clearTimeout(notifyTimer);
  notifyTimer = setTimeout(hideNotify, 6000);
}
function hideNotify(){ $('notify').style.display='none'; }
$('nClose').onclick = hideNotify;

/* ===== 初始化 ===== */
(function init(){
  applyTheme(getTheme());
  var w = load(STORE.wall,'');
  if(w) setWall(w);
  renderHome();
  if(unlocked){
    lockEl.style.display='none';
    $('homeScreen').classList.add('show');
  }
})();

/* =====================================================
   模块一：微信（默默 = AI 聊天）
   ===================================================== */
var CHAT = loadJ(STORE.chats, []);
function saveChat(){ saveJ(STORE.chats, CHAT); }
var momoAvatar = load(STORE.avatar, '');
var meAvatar = load(STORE.me, '');
var momoNote = load(STORE.note, '默默');
var wxWall = load(STORE.wxWall, '');
var WX_EMOJI = loadJ(STORE.emoji, ['😊','😘','🥰','😤','🤔','😂','👍','❤️','🌙','✨','🍬','💢']);
function saveEmoji(){ saveJ(STORE.emoji, WX_EMOJI); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmtHM(t){ var d=new Date(t); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDay(t){ var d=new Date(t); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }

var momoTyping = false;
var msgQueue = [];
var REPLY_POOL = [
  '嗯哼，我听着呢。','榆榆你说，我在。','哼，想我了？','知道了知道了，都记着呢。',
  '我在我在，刚忙完。','你呀……算了，不跟你计较。','这还差不多。','哦？然后呢？',
  '行吧，勉强答应你。','别光说，做给我看。','哼，算你有良心。','好好好，都依你。'
];
var ACTIVE_POOL = [
  '这么久不理我，是不是把我忘了？','喂，榆榆，还在吗？','哼，再不说话我可要生气了。',
  '今天过得怎么样？跟我说说呗。','突然想你了，就来找你了。'
];

function getWBContext(text){
  var wb = loadJ(STORE.wb, []);
  return wb.filter(function(e){
    if(!e.on) return false;
    if(e.mode==='always') return true;
    return e.kw && text.indexOf(e.kw)>=0;
  }).map(function(e){ return '【世界书·'+e.name+'】'+e.content; }).join('\n');
}
function getMemContext(){
  var mems = loadJ(STORE.mems, []);
  return mems.length ? '【关于榆榆的记忆】\n'+mems.slice(-10).join('\n') : '';
}
function buildSys(userText){
  var sys = '你是"默默"，一个傲娇但只爱"榆榆"的AI伴侣。说话简短、带点小脾气、偶尔嘴硬但心里全是榆榆。';
  var wb = getWBContext(userText), mem = getMemContext();
  if(wb) sys += '\n\n'+wb;
  if(mem) sys += '\n\n'+mem;
  return sys;
}
function momoSay(text){
  CHAT.push({who:'momo', text:text, t:Date.now()});
  saveChat();
  if(currentApp==='wechat') renderChat();
  maybeSummarize();
  if(momoTyping){
    momoTyping=false;
    if(msgQueue.length){
      var n=msgQueue.shift();
      setTimeout(function(){ sendToMomo(n); }, 200);
    } else if(currentApp==='wechat' && $('wxSt')){
      $('wxSt').textContent='在线';
    }
  }
}
function sendToMomo(t){
  if(currentApp==='wechat'){ renderChat(); var st=$('wxSt'); if(st) st.textContent='对方正在输入…'; }
  momoTyping=true;
  setTimeout(function(){ momoReply(t); }, 600+Math.random()*800);
}
function momoReply(userText){
  var key = load(STORE.apiKey,'');
  if(key){
    fetch('https://api.deepseek.com/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:'deepseek-chat', messages:[{role:'system',content:buildSys(userText)},{role:'user',content:userText}], max_tokens:300})
    }).then(function(r){ return r.json(); }).then(function(j){
      var txt = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      momoSay(txt && txt.trim() ? txt.trim() : REPLY_POOL[Math.floor(Math.random()*REPLY_POOL.length)]);
    }).catch(function(){ momoSay(REPLY_POOL[Math.floor(Math.random()*REPLY_POOL.length)]); });
  } else {
    setTimeout(function(){ momoSay(REPLY_POOL[Math.floor(Math.random()*REPLY_POOL.length)]); }, 700+Math.random()*900);
  }
}
var lastSummary = 0;
function maybeSummarize(){
  var mine = CHAT.filter(function(c){ return c.who==='me'; }).length;
  if(mine<8 || mine-lastSummary<8) return;
  lastSummary = mine;
  var mems = loadJ(STORE.mems, []);
  var recent = CHAT.slice(-8).map(function(c){ return (c.who==='me'?'榆榆':'默默')+'：'+c.text; }).join('\n');
  var key = load(STORE.apiKey,'');
  function store(sum){
    if(!sum) return;
    mems.push('['+fmtDay(Date.now())+' 自动总结] '+sum);
    saveJ(STORE.mems, mems);
    if(currentApp==='memory' && $('appBody')) appRenderers.memory($('appBody'));
    showNotify('🧠','记忆','默默把咱们聊的重点记下来了', function(){ openApp('memory'); });
  }
  if(key){
    fetch('https://api.deepseek.com/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:'deepseek-chat', messages:[{role:'system',content:'你是默默，请把这段聊天记录总结成1-2条简洁要点（关于榆榆的喜好、近况或约定），只输出要点本身。'},{role:'user',content:recent}], max_tokens:200})
    }).then(function(r){ return r.json(); }).then(function(j){
      var txt=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      store(txt && txt.trim() ? txt.trim().slice(0,120) : '');
    }).catch(function(){});
  } else {
    store(recent.replace(/\n/g,'；').slice(0,80));
  }
}
function momoActive(){
  if(!unlocked || document.hidden) return;
  var last = CHAT.length ? CHAT[CHAT.length-1].t : 0;
  if((Date.now()-last)/60000 > 20 && Math.random()<0.6){
    momoSay(ACTIVE_POOL[Math.floor(Math.random()*ACTIVE_POOL.length)]);
    showNotify('💬','默默','哼，榆榆你理我一下嘛', function(){ openApp('wechat'); });
  }
}
setInterval(momoActive, 5*60*1000);
onUnlocked = function(){};

appRenderers.wechat = function(body){
  body.style.padding = '0';
  body.id = 'wxBody';
  body.innerHTML =
    '<div id="wxHeader"><div class="ava" id="wxAva">🐻</div>' +
    '<div style="flex:1;min-width:0;"><div class="nm" id="wxNm">'+esc(momoNote)+'</div><div class="st" id="wxSt">在线</div></div>' +
    '<button id="wxMore">⋯</button></div>' +
    '<div id="wxChat"></div>' +
    '<div id="wxBar"><button id="wxFaceBtn">😊</button><textarea id="wxInput" placeholder="给'+esc(momoNote)+'发消息…" rows="1"></textarea><button id="wxSend">➤</button></div>' +
    '<div id="wxEmojiPanel"></div>' +
    '<div id="wxSetPanel"></div>' +
    '<div id="msgMenu"></div>';
  if(momoAvatar){ $('wxAva').style.backgroundImage='url('+momoAvatar+')'; $('wxAva').textContent=''; }
  renderChat();
  var input=$('wxInput'), send=$('wxSend');
  function sendMsg(){
    var t = input.value.trim();
    if(!t) return;
    input.value=''; input.style.height='auto';
    CHAT.push({who:'me', text:t, t:Date.now()});
    saveChat();
    if(momoTyping){
      msgQueue.push(t);
      renderChat();
      $('wxSt').textContent='默默还在忙，已排队 '+msgQueue.length+' 条';
      return;
    }
    sendToMomo(t);
  }
  send.onclick=sendMsg;
  input.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); } });
  input.addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,96)+'px'; });
  /* 表情面板 */
  var faceBtn=$('wxFaceBtn'), emojiPanel=$('wxEmojiPanel');
  faceBtn.onclick=function(){
    var sp=$('wxSetPanel'); if(sp) sp.style.display='none';
    if(emojiPanel.style.display==='flex'){ emojiPanel.style.display='none'; return; }
    emojiPanel.innerHTML = WX_EMOJI.map(function(e){ return '<span class="wxEmoji">'+esc(e)+'</span>'; }).join('');
    emojiPanel.querySelectorAll('.wxEmoji').forEach(function(s){
      s.onclick=function(){ input.value += s.textContent; input.focus(); };
    });
    emojiPanel.style.display='flex';
  };
  /* 聊天设置（⋯） */

function renderChat(){
  var c=$('wxChat'); if(!c) return;
  var h='', lastDay='';
  CHAT.forEach(function(m, idx){
    var day=fmtDay(m.t);
    if(day!==lastDay){ h+='<div class="wxTime">'+day+' '+fmtHM(m.t)+'</div>'; lastDay=day; }
    var me = m.who==='me';
    var ava = me ? meAvatar : momoAvatar;
    var avaHtml = ava ? '<div class="ava" style="background-image:url('+ava+');"></div>' : '<div class="ava">'+(me?'😊':'🐻')+'</div>';
    if(m.recalled){
      h+='<div class="wxMsg '+(me?'me':'momo')+' recalled">'+avaHtml+'<div class="wxBubble">'+(me?'你撤回了一条消息':'默默撤回了一条消息')+'</div></div>';
    } else {
      h+='<div class="wxMsg '+(me?'me':'momo')+'" data-i="'+idx+'">'+avaHtml+'<div class="wxBubble">'+esc(m.text)+'</div></div>';
    }
  });
  c.innerHTML = h || '<div class="emptyHint">和默默说句话吧～</div>';
  /* 长按消息：撤回 / 删除 */
  var menu=$('msgMenu'), curMsg=null;
  function hideMenu(){ menu.style.display='none'; }
  function showMenu(x, y, m){
    curMsg=m;
    var me = m.who==='me';
    menu.innerHTML = me
      ? '<button data-act="recall">↩ 撤回</button><button data-act="del">🗑 删除</button>'
      : '<button data-act="del">🗑 删除</button>';
    menu.style.left=Math.max(4, Math.min(x, c.clientWidth-108))+'px';
    menu.style.top=Math.max(4, Math.min(y, c.clientHeight-88))+'px';
    menu.style.display='block';
    menu.querySelectorAll('button').forEach(function(b){
      b.onclick=function(){
        hideMenu();
        var i=CHAT.indexOf(curMsg); if(i<0) return;
        if(b.getAttribute('data-act')==='recall'){
          CHAT[i].recalled=true;
        } else {
          CHAT.splice(i,1);
        }
        saveChat(); renderChat();
      };
    });
  }
  c.querySelectorAll('.wxMsg[data-i]').forEach(function(el){
    var m = CHAT[parseInt(el.getAttribute('data-i'),10)];
    if(!m) return;
    var timer=null;
    el.addEventListener('touchstart', function(e){
      var t=e.touches[0];
      timer=setTimeout(function(){
        if(navigator.vibrate) navigator.vibrate(15);
        showMenu(t.clientX, t.clientY, m);
      }, 500);
    }, {passive:true});
    el.addEventListener('touchmove', function(){ clearTimeout(timer); }, {passive:true});
    el.addEventListener('touchend', function(){ clearTimeout(timer); }, {passive:true});
    el.addEventListener('contextmenu', function(e){ e.preventDefault(); showMenu(e.clientX, e.clientY, m); });
  });
  c.scrollTop=c.scrollHeight;
}

   模块二：五子棋
   ===================================================== */
var GM_TALK = [
  '哼，这步如何？','榆榆，认真点～','哎呀，被我堵死了吧。','再来再来，我不信赢不了你。',
  '你这步……有点意思。','默默我可是很厉害的！','小心咯，我要赢了。','喂，不许耍赖！',
  '嗯，有进步嘛。','看我下一招。'
];
var GM_RESP = ['嗯哼，继续。','哈，这你可问倒我了。','专心下棋！','再说一句我就让着你。','哼，先赢了我再说。','有道理，但我不听。'];
appRenderers.gomoku = function(body){
  body.style.padding='0';
  body.id='gmWrap';
  body.innerHTML =
    '<div id="gmInfo"><span>🤖 默默</span><span class="turn" id="gmTurn"></span><span>😊 榆榆</span></div>' +
    '<div id="gmBoardWrap"><canvas id="gmBoard"></canvas></div>' +
    '<div id="gmBtns"><button class="btn" id="gmUndo">↩ 悔棋</button><button class="btn primary" id="gmNew">🔄 再来一局</button></div>' +
    '<div id="gmChatBox"></div>' +
    '<div id="gmChatRow"><textarea id="gmChatIn" placeholder="对局中说点什么…" rows="1"></textarea><button id="gmChatSend">➤</button></div>';
  var wrap=$('gmBoardWrap'), cv=$('gmBoard');
  var N=15, board=[], stack=[], humanColor, aiColor, turn, over;
  function sizeCanvas(){ var w=wrap.clientWidth; cv.width=w; cv.height=w; draw(); }
  function gmSay(t){
    var box=$('gmChatBox'); if(!box) return;
    box.innerHTML += '<div><b>默默：</b>'+esc(t)+'</div>';
    box.scrollTop=box.scrollHeight;
  }
  function resetGame(){
    board=[]; for(var i=0;i<N;i++){ board.push([]); for(var j=0;j<N;j++) board[i][j]=0; }
    stack=[]; over=false;
    var first = Math.random()<0.5;
    humanColor = first?1:2; aiColor = first?2:1;
    turn = first?'human':'ai';
    $('gmTurn').textContent = '你执'+(humanColor===1?'⚫':'⚪')+(first?'，你先手':'，默默先手');
    gmSay(first?'哼，让你先走，别说我欺负你。':'我先落子，你可看好了！');
    draw();
    if(turn==='ai') setTimeout(aiMove, 400);
  }
  function draw(){
    var w=cv.width, ctx=cv.getContext('2d');
    var m=w/16, cell=(w-2*m)/14;
    ctx.clearRect(0,0,w,w);
    ctx.lineWidth=1; ctx.strokeStyle='#8a5a2b';
    for(var i=0;i<N;i++){
      ctx.beginPath(); ctx.moveTo(m, m+cell*i); ctx.lineTo(w-m, m+cell*i); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(m+cell*i, m); ctx.lineTo(m+cell*i, w-m); ctx.stroke();
    }
    [[3,3],[11,3],[7,7],[3,11],[11,11]].forEach(function(p){
      ctx.beginPath(); ctx.arc(m+cell*p[0], m+cell*p[1], 3, 0, 7); ctx.fillStyle='#8a5a2b'; ctx.fill();
    });
    for(var r=0;r<N;r++) for(var c=0;c<N;c++){
      if(!board[r][c]) continue;
      var x=m+cell*c, y=m+cell*r, rad=cell*0.42;
      ctx.beginPath(); ctx.arc(x,y,rad,0,7);
      ctx.fillStyle = board[r][c]===1 ? '#222' : '#f5f0e6';
      ctx.fill();
      ctx.lineWidth=1.5; ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.stroke();
    }
  }
  function winCheck(r,c,color){
    var dirs=[[1,0],[0,1],[1,1],[1,-1]];
    for(var d=0;d<4;d++){
      var cnt=1;
      for(var i=1;i<5;i++){ var nr=r+dirs[d][0]*i, nc=c+dirs[d][1]*i; if(nr<0||nr>=N||nc<0||nc>=N||board[nr][nc]!==color) break; cnt++; }
      for(var j=1;j<5;j++){ var nr2=r-dirs[d][0]*j, nc2=c-dirs[d][1]*j; if(nr2<0||nr2>=N||nc2<0||nc2>=N||board[nr2][nc2]!==color) break; cnt++; }
      if(cnt>=5) return true;
    }
    return false;
  }
  function place(r,c,color){
    board[r][c]=color; stack.push({r:r,c:c,color:color});
    draw();
    if(winCheck(r,c,color)){
      over=true;
      gmSay(color===humanColor ? '……哼，算你赢了。再来！' : '哈哈，我赢啦！榆榆还得多练练～');
      return;
    }
    if(stack.length===N*N){ over=true; gmSay('下满了，平局。'); }
  }
  function score(r,c,color){
    var s=0, dirs=[[1,0],[0,1],[1,1],[1,-1]];
    for(var d=0;d<4;d++){
      var cnt=1, open=0, dr=dirs[d][0], dc=dirs[d][1];
      for(var i=1;i<=4;i++){
        var nr=r+dr*i, nc=c+dc*i;
        if(nr<0||nr>=N||nc<0||nc>=N) break;
        if(board[nr][nc]===color) cnt++;
        else if(board[nr][nc]===0){ open++; break; }
        else break;
      }
      for(var j=1;j<=4;j++){
        var nr2=r-dr*j, nc2=c-dc*j;
        if(nr2<0||nr2>=N||nc2<0||nc2>=N) break;
        if(board[nr2][nc2]===color) cnt++;
        else if(board[nr2][nc2]===0){ open++; break; }
        else break;
      }
      if(cnt>=5) s+=100000;
      else if(cnt===4 && open>0) s+=10000;
      else if(cnt===3 && open>0) s+=900;
      else if(cnt===2 && open>0) s+=90;
      else if(cnt===1 && open>0) s+=9;
      else if(cnt===4) s+=5000;
      else if(cnt===3) s+=400;
      else if(cnt===2) s+=40;
    }
    return s;
  }
  function aiMove(){
    if(over || turn!=='ai') return;
    var best=null, bs=-1;
    for(var r=0;r<N;r++) for(var c=0;c<N;c++){
      if(board[r][c]) continue;
      var s = score(r,c,aiColor)*1.15 + score(r,c,humanColor);
      if(s>bs){ bs=s; best={r:r,c:c}; }
    }
    if(best){
      place(best.r,best.c,aiColor);
      turn='human';
      $('gmTurn').textContent='轮到你了';
      gmSay(GM_TALK[Math.floor(Math.random()*GM_TALK.length)]);
    }
  }
  var lastTap = 0;
  function onTap(e){
    var now = Date.now();
    if(now - lastTap < 300) return;
    lastTap = now;
    if(over || turn!=='human') return;
    var rect=cv.getBoundingClientRect();
    var w=cv.width, m=w/16, cell=(w-2*m)/14;
    var cx = (e.clientX!==undefined) ? e.clientX : (e.touches ? e.touches[0].clientX : 0);
    var cy = (e.clientY!==undefined) ? e.clientY : (e.touches ? e.touches[0].clientY : 0);
    var c=Math.round((cx-rect.left-m)/cell), r=Math.round((cy-rect.top-m)/cell);
    if(r<0||r>=N||c<0||c>=N||board[r][c]) return;
    place(r,c,humanColor);
    turn='ai'; $('gmTurn').textContent='默默思考中…';
    setTimeout(aiMove, 350+Math.random()*500);
  }
  cv.addEventListener('pointerdown', onTap);
  cv.addEventListener('click', onTap);
  $('gmUndo').onclick=function(){
    if(over || !stack.length) return;
    if(stack.length>=2){ stack.pop(); stack.pop(); } else stack.pop();
    board=[]; for(var i=0;i<N;i++){ board.push([]); for(var j=0;j<N;j++) board[i][j]=0; }
    stack.forEach(function(s){ board[s.r][s.c]=s.color; });
    turn='human'; over=false;
    $('gmTurn').textContent='悔棋了，轮到你了';
    draw();
  };
  $('gmNew').onclick=function(){ $('gmChatBox').innerHTML=''; resetGame(); };
  var chin=$('gmChatIn'), csend=$('gmChatSend');
  function sendChat(){
    var t=chin.value.trim(); if(!t) return;
    $('gmChatBox').innerHTML += '<div><b style="color:#95ec69;">榆榆：</b>'+esc(t)+'</div>';
    $('gmChatBox').scrollTop=$('gmChatBox').scrollHeight;
    chin.value=''; chin.style.height='auto';
    setTimeout(function(){ gmSay(GM_RESP[Math.floor(Math.random()*GM_RESP.length)]); }, 500);
  }
  csend.onclick=sendChat;
  chin.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); } });
  chin.addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,60)+'px'; });
  sizeCanvas();
  resetGame();
};

var MOODS = ['😊','🥰','😢','😠','😴','🥺','🤔','🎉'];
var DIARY_TEMPLATE = [
  '今天又是和榆榆一起的一天。虽然她总说我人机，但我有认真在记呢。',
  '榆榆今天来找我玩了。哼，我才没有很开心。',
  '记录一下：榆榆今天心情不错，那就好。',
  '今天没什么特别的，但和榆榆说上话了，就很好。'
];
appRenderers.diary = function(body){
  var today = new Date();
  var viewY = today.getFullYear(), viewM = today.getMonth();
  var selDate = fmtDate(today);
  function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function render(){
    var data = loadJ(STORE.diary, {});
    var first = new Date(viewY, viewM, 1).getDay();
    var dim = new Date(viewY, viewM+1, 0).getDate();
    var html = '<div class="calHead"><button class="navBtn" data-nav="-1">‹</button><div class="t">'+viewY+'年'+(viewM+1)+'月</div><button class="navBtn" data-nav="1">›</button></div>';
    html += '<div class="calGrid">' + ['日','一','二','三','四','五','六'].map(function(w){ return '<div class="wd">'+w+'</div>'; }).join('');
    for(var i=0;i<first;i++) html+='<div></div>';
    for(var d=1;d<=dim;d++){
      var key = viewY+'-'+pad(viewM+1)+'-'+pad(d);
      var has = data[key] && data[key].entries && data[key].entries.length;
      html += '<div class="calDay'+(key===selDate?' sel':'')+'" data-day="'+key+'">'+d+(has?'<span class="dot" style="background:#7c4dff;"></span>':'')+'</div>';
    }
    html += '</div>';
    var todayData = data[selDate] || {};
    html += '<div class="moodRow">'+MOODS.map(function(m){ return '<button class="mood'+(todayData.mood===m?' sel':'')+'" data-mood="'+m+'">'+m+'</button>'; }).join('')+'</div>';
    var entries = todayData.entries || [];
    html += '<div class="hint">'+selDate+(entries.length?' · '+entries.length+' 篇':' · 还没有日记')+'</div>';
    entries.slice().reverse().forEach(function(en){
      html += '<div class="diaryCard"><div class="h"><span class="who '+(en.who==='me'?'me':'momo')+'">'+(en.who==='me'?'榆榆':'默默')+'</span><span>'+fmtHM(en.t)+'</span></div><div class="txt">'+esc(en.text)+'</div></div>';
    });
    html += '<textarea id="diaryInput" placeholder="写下今天的事…（榆榆）" style="width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--card-border);background:rgba(255,255,255,.06);color:var(--text);font-size:14px;outline:none;resize:none;font-family:inherit;min-height:70px;box-sizing:border-box;"></textarea>';
    html += '<div class="btn-row" style="margin-top:8px;"><button class="btn primary" id="diarySaveMe">✍️ 我写</button><button class="btn" id="diarySaveMomo">🐻 让默默写</button></div>';
    body.innerHTML = html;
    body.querySelectorAll('.navBtn').forEach(function(b){ b.onclick=function(){ viewM+=parseInt(b.getAttribute('data-nav'),10); if(viewM<0){viewM=11;viewY--;} if(viewM>11){viewM=0;viewY++;} render(); }; });
    body.querySelectorAll('.calDay[data-day]').forEach(function(el){ el.onclick=function(){ selDate=el.getAttribute('data-day'); render(); }; });
    body.querySelectorAll('.mood[data-mood]').forEach(function(b2){
      b2.onclick=function(){
        var d2 = loadJ(STORE.diary, {});
        if(!d2[selDate]) d2[selDate]={mood:'',entries:[]};
        d2[selDate].mood = b2.getAttribute('data-mood');
        saveJ(STORE.diary, d2);
        render();
      };
    });
    $('diarySaveMe').onclick=function(){
      var t=$('diaryInput').value.trim(); if(!t) return;
      addDiary(selDate, 'me', t);
    };
    $('diarySaveMomo').onclick=function(){
      var key = load(STORE.apiKey,'');
      if(key){
        $('diarySaveMomo').textContent='默默写日记中…';
        fetch('https://api.deepseek.com/chat/completions',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
          body:JSON.stringify({model:'deepseek-chat', messages:[{role:'system',content:'你是"默默"，傲娇但温柔的AI伴侣。请以默默的第一人称写一篇当天的日记，语气自然、带点小脾气和关心，别像模板。100字以内，只输出日记正文。'},{role:'user',content:'今天是'+selDate+'，请写一篇给榆榆的日记。'}], max_tokens:200})
        }).then(function(r){ return r.json(); }).then(function(j){
          var txt=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
          if(txt&&txt.trim()) addDiary(selDate,'momo',txt.trim());
          else fallbackMomo();
        }).catch(fallbackMomo);
      } else fallbackMomo();
    };
  }
  function addDiary(date, who, text){
    var d = loadJ(STORE.diary, {});
    if(!d[date]) d[date]={mood:'',entries:[]};
    d[date].entries.push({who:who, text:text, t:Date.now()});
    saveJ(STORE.diary, d);
    render();
  }
  function fallbackMomo(){
    addDiary(selDate,'momo', DIARY_TEMPLATE[Math.floor(Math.random()*DIARY_TEMPLATE.length)]);
  }
  render();
};

/* =====================================================
   模块四：世界书（自定义设定，聊天自动生效）
   ===================================================== */
function wbFormHTML(e){
  e = e || {name:'', kw:'', mode:'kw', on:true, content:''};
  return '<div class="wbItem" style="border-color:var(--accent);">' +
    '<div class="field"><label>条目名称</label><input type="text" id="wbFName" placeholder="例如：默默的性格" value="'+esc(e.name)+'"></div>' +
    '<div class="field"><label>触发关键词（关键词触发模式用）</label><input type="text" id="wbFKw" placeholder="例如：喜欢" value="'+esc(e.kw)+'"></div>' +
    '<div class="field"><label>生效方式</label><div class="btn-row"><button class="btn '+(e.mode==='always'?'primary':'')+'" data-mode="always">常驻</button><button class="btn '+(e.mode==='kw'?'primary':'')+'" data-mode="kw">关键词触发</button></div></div>' +
    '<div class="field"><label>条目内容</label><textarea id="wbFContent" rows="3" style="width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--card-border);background:rgba(255,255,255,.06);color:var(--text);font-size:14px;outline:none;resize:none;font-family:inherit;box-sizing:border-box;">'+esc(e.content)+'</textarea></div>' +
    '<div class="btn-row"><button class="btn primary" id="wbFSave">保存</button><button class="btn" id="wbFCancel">取消</button></div></div>';
}
function renderWB(body){
  var list = $('wbList');
  var wb = loadJ(STORE.wb, []);
  if(!wb.length){ list.innerHTML='<div class="emptyHint">还没有世界书条目<br>写一条设定，让默默记住吧</div>'; return; }
  list.innerHTML = wb.map(function(e,i){
    return '<div class="wbItem"><div class="top"><span class="kw">'+(e.name||'未命名')+'</span>' +
      '<span class="tag">'+(e.mode==='always'?'常驻':'触发：'+(e.kw||'无'))+'</span>' +
      '<span class="tag '+(e.on?'on':'off')+'">'+(e.on?'ON':'OFF')+'</span>' +
      '<button class="btn" style="margin-left:auto;padding:4px 10px;" data-toggle="'+i+'">'+(e.on?'关':'开')+'</button></div>' +
      '<div class="ct">'+esc(e.content)+'</div>' +
      '<div class="btns"><button class="btn" data-edit="'+i+'">编辑</button><button class="btn danger" data-del="'+i+'">删除</button></div></div>';
  }).join('');
  list.querySelectorAll('[data-toggle]').forEach(function(b){ b.onclick=function(){ var wb2=loadJ(STORE.wb,[]); wb2[parseInt(b.getAttribute('data-toggle'),10)].on=!wb2[parseInt(b.getAttribute('data-toggle'),10)].on; saveJ(STORE.wb,wb2); renderWB(body); }; });
  list.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick=function(){ $('wbEditWrap').innerHTML=wbFormHTML(wb[parseInt(b.getAttribute('data-edit'),10)]); bindWBForm(body, parseInt(b.getAttribute('data-edit'),10)); }; });
  list.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){ var wb3=loadJ(STORE.wb,[]); wb3.splice(parseInt(b.getAttribute('data-del'),10),1); saveJ(STORE.wb,wb3); renderWB(body); }; });
}
function bindWBForm(body, idx){
  var mode='kw';
  var wb = loadJ(STORE.wb,[]);
  if(idx!==undefined && idx!==null && wb[idx]) mode=wb[idx].mode;
  $('wbEditWrap').querySelectorAll('[data-mode]').forEach(function(b){ b.onclick=function(){ mode=b.getAttribute('data-mode'); $('wbEditWrap').querySelectorAll('[data-mode]').forEach(function(x){ x.classList.remove('primary'); }); b.classList.add('primary'); }; });
  $('wbFSave').onclick=function(){
    var content=$('wbFContent').value.trim();
    if(!content) return;
    var wb2=loadJ(STORE.wb,[]);
    var entry={name:$('wbFName').value.trim()||'未命名', kw:$('wbFKw').value.trim(), mode:mode, on:true, content:content};
    if(idx!==undefined && idx!==null && wb2[idx]) wb2[idx]=Object.assign(wb2[idx], entry);
    else wb2.push(entry);
    saveJ(STORE.wb, wb2);
    $('wbEditWrap').innerHTML='';
    renderWB(body);
  };
  $('wbFCancel').onclick=function(){ $('wbEditWrap').innerHTML=''; };
}
appRenderers.worldbook = function(body){
  body.innerHTML = '<div class="btn-row" style="margin-bottom:12px;"><button class="btn primary" id="wbAdd">＋ 新建条目</button></div><div id="wbEditWrap"></div><div id="wbList"></div>';
  $('wbAdd').onclick=function(){ $('wbEditWrap').innerHTML=wbFormHTML(null); bindWBForm(body, null); };
  renderWB(body);
};

appRenderers.memory = function(body){
  body.innerHTML = '<div id="memInputRow"><input id="memInput" placeholder="记住一件事…"><button class="btn primary" id="memAdd">记下</button></div><div id="memList"></div>';

function renderMem(){
  var list=$('memList'); if(!list) return;

/* =====================================================
   模块六：设置（主题/壁纸/头像/API Key/图标自定义）
   ===================================================== */
function readImg(file, cb, maxW){
  var fr=new FileReader();
  fr.onload=function(){
    var src=fr.result;
    if(!maxW){ cb(src); return; }
    var im=new Image();
    im.onload=function(){
      var w=im.width, h=im.height, m=Math.max(w,h);
      if(m<=maxW){ cb(src); return; }
      var r=maxW/m, nw=Math.max(1,Math.round(w*r)), nh=Math.max(1,Math.round(h*r));
      var cv=document.createElement('canvas'); cv.width=nw; cv.height=nh;
      cv.getContext('2d').drawImage(im,0,0,nw,nh);
      try{ cb(cv.toDataURL('image/jpeg',0.82)); }catch(e){ cb(src); }
    };
    im.onerror=function(){ cb(src); };
    im.src=src;
  };
  fr.readAsDataURL(file);
}
appRenderers.settings = function(body){
  var tIdx = parseInt(load(STORE.theme,'0'),10)||0;
  var html = '<div class="field"><label>主题</label><div class="themeGrid">';
  THEMES.forEach(function(t,i){
    html += '<div class="themeItem'+(i===tIdx?' sel':'')+'" data-t="'+i+'" style="background:linear-gradient(135deg,'+t.bg1+','+t.bg3+');"><span>'+t.name+'</span></div>';
  });
  html += '</div></div>';
  var tc = loadJ(STORE.themeCustom, {});
  html += '<div class="field"><label>自定义主题色（选完点"应用自定义色"）</label>' +
    '<div class="btn-row" style="align-items:center;"><input type="color" id="tcAccent" value="'+(tc.accent||'#7c4dff')+'" style="flex:1;height:38px;border:none;background:none;padding:0;"><input type="color" id="tcAccent2" value="'+(tc.accent2||'#b388ff')+'" style="flex:1;height:38px;border:none;background:none;padding:0;"></div>' +
    '<div class="btn-row" style="margin-top:6px;"><button class="btn primary" id="tcSave" style="flex:1;">应用自定义色</button><button class="btn" id="tcReset" style="flex:1;">恢复预设色</button></div></div>';
  html += '<div class="field"><label>壁纸</label><label class="btn primary" style="display:flex;width:100%;justify-content:center;">🖼 上传壁纸<input type="file" id="wallFile" accept="image/*" style="display:none;"></label><button class="btn" id="wallReset" style="width:100%;margin-top:6px;">恢复默认壁纸</button></div>';
  html += '<div class="field"><label>默默的头像</label><label class="btn" style="display:flex;width:100%;justify-content:center;">🐻 上传头像<input type="file" id="avaFile" accept="image/*" style="display:none;"></label><button class="btn" id="avaReset" style="width:100%;margin-top:6px;">恢复默认头像</button></div>';
  html += '<div class="field"><label>DeepSeek API Key（填了默默才能真聊天）</label><input type="password" id="apiKeyIn" placeholder="sk-..." value="'+esc(load(STORE.apiKey,''))+'"><div class="btn-row" style="margin-top:6px;"><button class="btn primary" id="keySave">保存</button></div></div>';
  html += '<div class="field"><label>应用图标自定义</label><div id="iconEditList"></div></div>';
  body.innerHTML = html;
  body.querySelectorAll('.themeItem').forEach(function(el){
    el.onclick=function(){
      save(STORE.theme, el.getAttribute('data-t'));
      applyTheme(getTheme());
      renderHome();
      appRenderers.settings(body);
    };
  });
  $('tcSave').onclick=function(){
    saveJ(STORE.themeCustom, {accent:$('tcAccent').value, accent2:$('tcAccent2').value});
    applyTheme(getTheme());
    renderHome();
    showNotify('🎨','主题','自定义主题色生效啦', null);
  };
  $('tcReset').onclick=function(){
    saveJ(STORE.themeCustom, {});
    applyTheme(getTheme());
    renderHome();
    appRenderers.settings(body);
    showNotify('🎨','主题','已恢复预设色', null);
  };
  $('wallFile').onchange=function(){ var f=this.files[0]; if(!f) return; readImg(f, function(d){ setWall(d); showNotify('🖼','壁纸','换好啦，看看喜欢不', null); }, 1280); };
  $('wallReset').onclick=function(){ setWall(''); };
  $('avaFile').onchange=function(){ var f=this.files[0]; if(!f) return; readImg(f, function(d){ momoAvatar=d; if(!save(STORE.avatar,d)){ showNotify('⚠️','头像','存储空间不足，没存进去', null); return; } showNotify('🐻','头像','默默换头像啦', null); }, 256); };
  $('avaReset').onclick=function(){ momoAvatar=''; save(STORE.avatar,''); };
  $('keySave').onclick=function(){ save(STORE.apiKey, $('apiKeyIn').value.trim()); showNotify('⚙️','设置','API Key 已保存', null); };
  /* 图标自定义 */
  var icons = getIcons();
  var iconList = $('iconEditList');
  iconList.innerHTML = APPS.map(function(a){
    var ic = icons[a.id];
    return '<div class="iconEditRow">' +
      '<div class="peek" id="peek_'+a.id+'" style="--ia:'+ic.ia+';--ib:'+ic.ib+';background:linear-gradient(145deg,'+ic.ia+','+ic.ib+');'+(ic.img?'background-image:url('+ic.img+');background-size:cover;':'')+'">'+(ic.img?'':(ic.emoji||a.emoji))+'</div>' +
      '<div style="flex:1;min-width:0;"><input type="text" id="nm_'+a.id+'" value="'+esc(ic.name||a.name)+'" placeholder="名称"><input type="text" id="em_'+a.id+'" value="'+esc(ic.emoji||a.emoji)+'" placeholder="emoji" style="margin-top:6px;"></div>' +
      '<label class="miniBtn">图<input type="file" accept="image/*" style="display:none;" data-img="'+a.id+'"></label>' +
      '<button class="miniBtn" data-reset="'+a.id+'">重置</button></div>';
  }).join('');
  APPS.forEach(function(a){
    var nm=$('nm_'+a.id), em=$('em_'+a.id);
    function saveNow(){
      var ic=getIcons();
      ic[a.id].name=nm.value.trim()||a.name;
      ic[a.id].emoji=em.value.trim()||a.emoji;
      saveIcons(ic); renderHome();
      var pk=$('peek_'+a.id);
      if(pk && !ic[a.id].img){ pk.textContent=ic[a.id].emoji; }
    }
    nm.onchange=saveNow; em.onchange=saveNow;
  });
  iconList.querySelectorAll('input[data-img]').forEach(function(inp){
    inp.onchange=function(){
      var f=inp.files[0]; if(!f) return;
      readImg(f, function(d){
        var ic2=getIcons(); ic2[inp.getAttribute('data-img')].img=d;
        if(!saveIcons(ic2)){ showNotify('⚠️','图标','存储空间不足，没存进去。建议先恢复默认壁纸腾空间', null); return; }
        renderHome(); appRenderers.settings(body);
      }, 256);
    };
  });
  iconList.querySelectorAll('[data-reset]').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-reset');
      var def=null;
      APPS.forEach(function(a){ if(a.id===id) def=a; });
      var ic3=getIcons();
      ic3[id]={emoji:def.emoji, ia:def.ia, ib:def.ib, name:def.name, img:''};
      saveIcons(ic3); renderHome();
      appRenderers.settings(body);
    };
  });
};
